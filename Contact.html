<style>
    /* Music Player Styles */
        
        .player {
            margin-bottom: 30px;
        }

        .vinyl-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }

        .vinyl-btn:hover {
            transform: scale(1.05);
        }

        .vinyl {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: block;
            border: 5px solid #ff4b33;
            /* Animation setup */
            animation: spin 3.5s linear infinite;
            animation-play-state: paused;
        }

        /* This triggers when the JS adds the 'spinning' class */
        .vinyl.spinning {
            animation-play-state: running;
        }

        .label {
            font-size: 14px;
            color: #ff4b33;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ff4b33;
        }

        

      

     


        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
